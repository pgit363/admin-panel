name: Deploy Admin Panel

# Push to `test`   -> build (api-test) -> Cloudflare Pages project test-tourkokan-admin
# Push to `master` -> build (prod)     -> Cloudflare Pages project prod-tourkokan-admin
on:
  push:
    branches: [test, master]
  workflow_dispatch:

jobs:
  deploy-test:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:test
      - name: Deploy to Cloudflare Pages (test)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e56e1812faccec3009583f5067b53231
          command: pages deploy build --project-name=test-tourkokan-admin --branch=test

  deploy-prod:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Deploy to Cloudflare Pages (prod)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e56e1812faccec3009583f5067b53231
          command: pages deploy build --project-name=prod-tourkokan-admin --branch=master
